name: mydotnet project

on:
  push:
    branches:
      - develop

jobs:
  myjob:
    runs-on: 'self-hosted'
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
    - name: dotnet version
      uses: actions/setup-dotnet@v4 
      with:
        dotnet-version: "9.0.100"
    - name: this is my dotnet publish command
      run: dotnet publish -c Release src/Presentation/Nop.Web/Nop.Web.csproj -o demo
    - name: SonarQube Scan
      uses: SonarSource/sonarcloud-github-action@v3
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with: 
          args: >
            -Dsonar.organization=shasha617
            -Dsonar.projectKey=shasha617_nopCommerce
            -Dsonar.host.url=https://sonarcloud.io
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-south-1
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
    - name: Build Docker image
      env:
        ECR_REGISTRY: aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 821111361348.dkr.ecr.ap-south-1.amazonaws.com
        ECR_REPOSITORY: dev/nop
        IMAGE_TAG: latest
      run: |
        docker build -t dev/nop .
        docker tag dev/nop:latest 821111361348.dkr.ecr.ap-south-1.amazonaws.com/dev/nop:latest
        docker push 821111361348.dkr.ecr.ap-south-1.amazonaws.com/dev/nop:latest